default:
  tags:
    - cohort

stages:
  - checks
  - terraform
  - build
  - push
  - deploy
  - smoke

variables:
  # gitleaks scans history and commitlint needs the merge-request commit range;
  # both are wrong or empty under the default shallow clone.
  GIT_DEPTH: 0

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

checks:
  stage: checks
  cache:
    key:
      files:
        - pyproject.toml
        - requirements.txt
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  script:
    - pip install --quiet -e '.[dev]'
    - pip install --quiet -r requirements.txt
    - echo "── ruff ─────────────────────────────────────────"
    - ruff check .
    - echo "── prettier ─────────────────────────────────────"
    - prettier --check .
    - echo "── markdownlint ─────────────────────────────────"
    - markdownlint "**/*.md"
    - echo "── yamllint ─────────────────────────────────────"
    - yamllint --config-file .yamllint.yml .
    - echo "── vale ─────────────────────────────────────────"
    - vale --config .vale.ini --no-wrap README.md src tests
    - echo "── mypy ─────────────────────────────────────────"
    - mypy
    - echo "── pytest ───────────────────────────────────────"
    - pytest -q
    - echo "── gitleaks ─────────────────────────────────────"
    - gitleaks git --verbose --redact .
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        echo "── commitlint (merge request commits) ───────────"
        commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to "$CI_COMMIT_SHA" --verbose
        echo "── mr-title (imperative mood) ───────────────────"
        printf '%s\n' "$CI_MERGE_REQUEST_TITLE" > mr-title.txt
        vale --config .vale.ini --no-wrap mr-title.txt
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "── commitlint-history (non-blocking) ────────────"
        commitlint --from "$(git rev-list --max-parents=0 HEAD | tail -1)" --to HEAD --verbose \
          || echo "WARNING: history has non-conforming commits. Not failing the pipeline yet."
      fi

terraform:
  stage: terraform
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - cd terraform
    - echo "── terraform fmt ────────────────────────────────"
    - terraform fmt -check -recursive
    - echo "── terraform init ────────────────────────────────"
    - terraform init -input=false
    - echo "── terraform validate ────────────────────────────────"
    - terraform validate
    - echo "── terraform plan ────────────────────────────────"
    - terraform plan -input=false -lock-timeout=5m

build:
  # Builds the Docker image. Then composes the
  stage: build
  image: docker:29.7.2
  services:
    - docker:29.7.2-dind
  variables:
    ECR_REPOSITORY: terraform-meridian-web-application
    DOCKER_TLS_CERTDIR: '/certs'
  # Only rebuild when a file that actually ends up in the image changed. See
  # README, Stage 2: Build. Taken From Anish's Repository.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/**/*
        - requirements.txt
        - Dockerfile
        - .dockerignore
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
  script:
    - docker build -t "$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA" .
    - docker save "$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

push:
  stage: push
  needs: ['build']
  image: docker:29.7.2
  services:
    - docker:29.7.2-dind
  rules:
    # Only automatically runs after merging with main
    # Can manually run if on a protected branch
    # Only rebuild when a file that actually ends up in the image changed. See
    # README, Stage 3: Push. Taken From Anish's Repository.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/**/*
        - requirements.txt
        - Dockerfile
        - .dockerignore
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
  variables:
    ECR_REPOSITORY: terraform-meridian-web-application
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - apk add --no-cache aws-cli
  script:
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login
      --username AWS --password-stdin
      "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker load -i image.tar
    - docker tag "$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA"
      "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA"
    - docker push
      "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA"

# Deploys new application to cluster when application code changes are made
# The cluster MUST be running AND the NewsAPI key MUST be in the secrets for this to work, has to be run manually
# Remember to delete LoadBalancer and then cluster after this stage has been run
deploy:
  stage: deploy
  needs:
    # If push needs to send an image, deploy will wait for push
    # If push does not need to send an image but deploy does need to deploy
    # (like if there is a manifest change but no application change) then
    # deploy will still deploy without waiting for a stage that never happens
    - job: push
      optional: true
  rules:
    # Only automatically runs after merging with main
    # Can manually run if on a protected branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - k8s/app/**/*
        - src/**/*
        - requirements.txt
        - Dockerfile
        - .dockerignore
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
  variables:
    ECR_REPOSITORY: terraform-meridian-web-application
  before_script:
    # Install system dependencies
    - apt-get update
    - apt-get install -y curl unzip gettext-base
    - rm -rf /var/lib/apt/lists/*

    # Install AWS CLI
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o
      "awscliv2.zip"
    - unzip -q awscliv2.zip
    - ./aws/install

    # Install kubectl
    - KUBECTL_VERSION="v1.34.0"
    - curl -LO
      "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

    - aws eks update-kubeconfig --region "$AWS_DEFAULT_REGION" --name
      "$EKS_CLUSTER_NAME"

    # Checks if the cluster is active, fails if it isn't
    - |
      if ! kubectl cluster-info --request-timeout=10s > /dev/null 2>&1; then
        echo "ERROR: Cannot reach EKS cluster '$EKS_CLUSTER_NAME'. Is it running? See RUNBOOK.md to start it before deploying."
        exit 1
      fi

  script:
    # Applies the manifests after setting the image variable
    - kubectl create secret generic meridian-api-keys
      --from-literal=NEWS_API_KEY="$NEWS_API_KEY" --dry-run=client -o yaml |
      kubectl apply -f -

    - export
      MERIDIAN_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA"
    - kubectl apply -f k8s/app/configmap.yaml -f k8s/app/service.yaml -f
      k8s/app/hpa.yaml
    - envsubst < k8s/app/deployment.yaml | kubectl apply -f -

    - kubectl rollout status deployment/meridian-web-application --timeout=120s

smoke:
  stage: smoke
  needs: ['deploy']

  rules:
    # Only automatically runs after merging with main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - k8s/app/**/*
        - src/**/*
        - requirements.txt
        - Dockerfile
        - .dockerignore

    # Can manually run if on a protected branch
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: manual

  before_script:
    # Install system dependencies
    - apt-get update
    - apt-get install -y curl unzip
    - rm -rf /var/lib/apt/lists/*

    # Install AWS CLI
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o
      "awscliv2.zip"
    - unzip -q awscliv2.zip
    - ./aws/install

  script:
    - |
      echo "Waiting for Load Balancer..."

      for i in $(seq 1 30); do
        ALB_DNS_NAME=$(aws elbv2 describe-load-balancers \
          --query "LoadBalancers[?LoadBalancerName=='meridian-web-application-alb'].DNSName | [0]" \
          --output text)

        if [ -n "$ALB_DNS_NAME" ] && [ "$ALB_DNS_NAME" != "None" ]; then
          echo "Load Balancer: $ALB_DNS_NAME"
          break
        fi

        echo "Load Balancer not ready yet ($i/30)"
        sleep 10
      done

      if [ -z "$ALB_DNS_NAME" ] || [ "$ALB_DNS_NAME" = "None" ]; then
        echo "ERROR: Load Balancer was not found."
        exit 1
      fi

      echo "Running smoke test against http://$ALB_DNS_NAME/news..."

      for i in $(seq 1 30); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          --connect-timeout 5 \
          --max-time 10 \
          "http://$ALB_DNS_NAME/news" || true)

        echo "Attempt $i/30: HTTP $STATUS"

        if [ "$STATUS" = "200" ]; then
          echo "Smoke test passed."
          exit 0
        fi

        sleep 10
      done

      echo "ERROR: /news did not return HTTP 200 after 30 attempts."
      exit 1
