---
default:
  tags:
    - cohort

stages:
  - checks
  - terraform
  - build
  - trivy
  - push
  - deploy
  - smoke

variables:
  # gitleaks scans history and commitlint needs the merge-request commit range;
  # both are wrong or empty under the default shallow clone.
  GIT_DEPTH: 0

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.application_changes:
  changes:
    - k8s/app/**/*
    - src/**/*
    - requirements.txt
    - Dockerfile
    - .dockerignore

checks:
  stage: checks
  script:
    - pip install --quiet -r requirements.txt
    - pip install --quiet -r requirements-dev.txt
    - echo "── ruff ─────────────────────────────────────────"
    - ruff check .
    - echo "── prettier ─────────────────────────────────────"
    - prettier --check .
    - echo "── markdownlint ─────────────────────────────────"
    - markdownlint "**/*.md"
    - echo "── yamllint ─────────────────────────────────────"
    - yamllint --config-file .yamllint.yml .
    - echo "── vale ─────────────────────────────────────────"
    - vale --config .vale.ini --no-wrap README.md src tests
    - echo "── mypy ─────────────────────────────────────────"
    - mypy
    - echo "── pytest ───────────────────────────────────────"
    - pytest -q
    - echo "── gitleaks ─────────────────────────────────────"
    - gitleaks git --verbose --redact .
    - echo "── pip-audit ─────────────────────────────────────"
    - pip-audit --progress-spinner off
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        echo "── commitlint (merge request commits) ───────────"
        commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to "$CI_COMMIT_SHA" --verbose
        echo "── mr-title (imperative mood) ───────────────────"
        printf '%s\n' "$CI_MERGE_REQUEST_TITLE" > mr-title.txt
        vale --config .vale.ini --no-wrap mr-title.txt
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "── commitlint-history (non-blocking) ────────────"
        commitlint --from "$(git rev-list --max-parents=0 HEAD | tail -1)" --to HEAD --verbose \
          || echo "WARNING: history has non-conforming commits. Not failing the pipeline yet."
      fi

# Only runs the terraform fmt and validate commands. Does not require backend or protected CI variables.
terraform-fmt-validate:
  stage: terraform
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cd terraform
    - terraform fmt -check -recursive
    - terraform init -input=false -backend=false
    - terraform validate

# Adds the terraform plan command. Requires backend and protected CI variables.
terraform-plan:
  stage: terraform
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if:
        '$CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED == "true"'
  script:
    - cd terraform
    - terraform init -input=false
    - terraform validate
    - terraform plan -input=false -lock-timeout=5m

# Builds the Docker image. Then composes the image into an artifact
build:
  stage: build
  image: docker:29.7.2
  services:
    - docker:29.7.2-dind
  variables:
    ECR_REPOSITORY: terraform-meridian-web-application
    DOCKER_TLS_CERTDIR: '/certs'
  # Only rebuild when application code, dockerfile, or manifest change on default branch.
  # Build always when in a merge request for scanning purposes.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: !reference [.application_changes, changes]
  script:
    - docker build -t "$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA" .
    - docker save "$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

# Scans the Docker image for vulnerabilities using Trivy.
# Fails the job if any HIGH or CRITICAL vulnerabilities are found.
trivy:
  stage: trivy
  needs: ['build']
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: ['']
  rules:
    # Only scan when application code, dockerfile, or manifest change on default branch.
    # Scan always when in a merge request.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: !reference [.application_changes, changes]
  script:
    - trivy image --input image.tar --exit-code 1 --severity HIGH,CRITICAL

# Pushes the Docker image to ECR.
# Pushes to the ECR built by Terraform
push:
  stage: push
  needs: ['build', 'trivy']
  image: docker:29.7.2
  services:
    - docker:29.7.2-dind
  rules:
    # Only push when application code, dockerfile, or manifest change on default branch.
    # Push manually when in a merge request on a protected branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: !reference [.application_changes, changes]
    - if:
        '$CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED == "true"'
      when: manual
  variables:
    ECR_REPOSITORY: terraform-meridian-web-application
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - apk add --no-cache aws-cli
  script:
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login
      --username AWS --password-stdin
      "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker load -i image.tar
    - docker tag "$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA"
      "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA"
    - docker push
      "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA"

# Deploys new application to cluster when application code changes are made
# The cluster MUST be running AND the NewsAPI key MUST be in the secrets for this to work
deploy:
  stage: deploy
  needs:
    - job: push
      optional: true
  image: ci-tools:latest
  rules:
    # Only deploy when application code, dockerfile, or manifest change on default branch.
    # Deploy automatically when in a merge request on a protected branch and push has been run.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: !reference [.application_changes, changes]
    - if:
        '$CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED == "true"'
  variables:
    ECR_REPOSITORY: terraform-meridian-web-application
  before_script:
    # Install system dependencies
    - apt-get update
    - apt-get install -y curl gettext-base
    - rm -rf /var/lib/apt/lists/*

    # Install kubectl
    - KUBECTL_VERSION="v1.34.0"
    - curl -LO
      "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

    # AWS CLI does not need to be explicitly installed because the GitLab runner image already has it.
    - aws eks update-kubeconfig --region "$AWS_DEFAULT_REGION" --name
      "$EKS_CLUSTER_NAME"

  script:
    # Applies the manifests after setting the image variable

    - export
      MERIDIAN_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA"
    - kubectl apply -f k8s/app/configmap.yaml -f k8s/app/service.yaml -f
      k8s/app/hpa.yaml
    - envsubst < k8s/app/deployment.yaml | kubectl apply -f -

    - kubectl rollout status deployment/meridian-web-application --timeout=120s

smoke:
  stage: smoke
  needs: ['deploy']
  image: ci-tools:latest
  rules:
    # Only smoke when application code, dockerfile, or manifest change on default branch.
    # Smoke automatically when in a merge request on a protected branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: !reference [.application_changes, changes]
    - if:
        '$CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED == "true"'

  before_script:
    # Install system dependencies
    # AWS CLI does not need to be explicitly installed because the GitLab runner image already has it.
    - apt-get update
    - apt-get install -y curl
    - rm -rf /var/lib/apt/lists/*

  script:
    - |
      echo "Waiting for Load Balancer..."

      for i in $(seq 1 30); do
        ALB_DNS_NAME=$(aws elbv2 describe-load-balancers \
          --query "LoadBalancers[?LoadBalancerName=='meridian-web-application-alb'].DNSName | [0]" \
          --output text)

        if [ -n "$ALB_DNS_NAME" ] && [ "$ALB_DNS_NAME" != "None" ]; then
          echo "Load Balancer: $ALB_DNS_NAME"
          break
        fi

        echo "Load Balancer not ready yet ($i/30)"
        sleep 10
      done

      if [ -z "$ALB_DNS_NAME" ] || [ "$ALB_DNS_NAME" = "None" ]; then
        echo "ERROR: Load Balancer was not found."
        exit 1
      fi

      echo "Running smoke test against http://$ALB_DNS_NAME/news..."

      for i in $(seq 1 30); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          --connect-timeout 5 \
          --max-time 10 \
          "http://$ALB_DNS_NAME/news" || true)

        echo "Attempt $i/30: HTTP $STATUS"

        if [ "$STATUS" = "200" ]; then
          echo "Smoke test passed."
          exit 0
        fi

        sleep 10
      done

      echo "ERROR: /news did not return HTTP 200 after 30 attempts."
      exit 1
