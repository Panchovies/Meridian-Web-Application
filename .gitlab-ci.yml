# Four checks, all of them blocking. The same four run locally via pre-commit,
# so a red pipeline should never be the first time you hear about a problem.
stages:
  - lint
  - test

variables:
  # gitleaks scans history and commitlint needs the merge-request commit range;
  # both are wrong or empty under the default shallow clone.
  GIT_DEPTH: 0

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.python:
  image: python:3.11-slim
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet -e '.[dev]'

ruff:
  extends: .python
  stage: lint
  script:
    - ruff check .

mypy:
  extends: .python
  stage: lint
  script:
    - mypy

gitleaks:
  stage: lint
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    # --redact keeps any finding out of the job log, which is readable by
    # everyone in the group. The finding itself is still reported.
    - gitleaks git --verbose --redact .

commitlint:
  stage: lint
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache git
    - npm install --no-save --silent @commitlint/cli @commitlint/config-conventional
  script:
    - npx commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to "$CI_COMMIT_SHA" --verbose

commitlint-history:
  # The commitlint job above only sees the merge request's own commits. This one
  # checks every commit ever made on the default branch, which is what a
  # changelog generator actually reads.
  #
  # allow_failure is on until the back-catalog has been rewritten. Once your
  # history is clean, delete that line so this becomes blocking.
  stage: lint
  image: node:22-alpine
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache git
    - npm install --no-save --silent @commitlint/cli @commitlint/config-conventional
  script:
    - npx commitlint --from "$(git rev-list --max-parents=0 HEAD | tail -1)" --to HEAD --verbose

pytest:
  extends: .python
  stage: test
  script:
    - pytest -q
