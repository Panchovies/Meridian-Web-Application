apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-web-application
  labels:
    app: meridian-web-application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meridian-web-application
  template:
    metadata:
      labels:
        app: meridian-web-application
    spec:
      containers:
      - name: meridian-web-application
        image: meridian-web-application:local
        imagePullPolicy: Never
        envFrom:
          - secretRef:
              name: meridian-api-keys
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"