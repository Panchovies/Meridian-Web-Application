apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-web-application
  labels:
    app: meridian-web-application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meridian-web-application
  template:
    metadata:
      labels:
        app: meridian-web-application
    spec:
      containers:
      - name: meridian-web-application
        image: meridian-web-application:local
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        envFrom:
          - configMapRef:
                name: meridian-web-application-config
          - secretRef:
              name: meridian-api-keys
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 0
          periodSeconds: 3
          failureThreshold: 1
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"