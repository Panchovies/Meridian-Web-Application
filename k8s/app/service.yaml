apiVersion: v1
kind: Service
metadata:
  name: meridian-web-application
  labels:
    app: meridian-web-application
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: 'http'
spec:
  type: LoadBalancer
  selector:
    app: meridian-web-application
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
