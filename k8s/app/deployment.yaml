apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-web-application
  labels:
    app: meridian-web-application
spec:
  revisionHistoryLimit: 20
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: meridian-web-application
  template:
    metadata:
      labels:
        app: meridian-web-application
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: meridian-web-application
          image: ${MERIDIAN_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 5000

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10

          envFrom:
            - configMapRef:
                name: meridian-web-application-config
            - secretRef:
                name: meridian-api-keys

          # Liveness and readiness probes for /health endpoint
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

          # Determines resource requests and limits
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '250m'
