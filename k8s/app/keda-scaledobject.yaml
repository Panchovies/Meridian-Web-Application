apiVersion: keda.sh/v1alpha1
kind: ScaledObject

metadata:
  name: meridian-web-application-scaler
  namespace: default

spec:
  scaleTargetRef:
    name: meridian-web-application

  minReplicaCount: 2
  maxReplicaCount: 6

  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: meridian-sqs-auth

      metadata:
        queueURL: https://sqs.us-east-1.amazonaws.com/163558211438/meridian-queue
        queueLength: '10'
        awsRegion: us-east-1
