# Vale checks prose: the README, and the comments inside the code.
#
# Only Vale's built-in style is enabled, which means this needs no `vale sync`
# and no network access — it runs the same on a laptop, in CI, and on a plane.
# That built-in style is spelling, repeated words, and inconsistent terms.
#
# To add opinionated prose rules later, uncomment the Packages line and run
# `vale sync` once. It downloads to StylesPath, which is gitignored.
#
# Packages = Google

StylesPath = .vale/styles
MinAlertLevel = error
Vocab = Meridian

# The README is the document someone else reads first.
[*.md]
BasedOnStyles = Vale

# Vale understands Python source and lints only the comments and docstrings,
# not the code. A misspelled identifier is ruff's problem; a misspelled
# sentence explaining why the identifier exists is this one's.
[*.py]
BasedOnStyles = Vale

# Commit subjects and merge request titles, piped in as plain text. Only the
# imperative rule applies here — a subject is not prose and must not be
# spell-checked as though it were, because it is mostly identifiers.
[*.txt]
BasedOnStyles = Meridian
